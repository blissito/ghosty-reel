<!doctype html><html lang="es"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base-v.css" />
<style>
  /* en vertical el tablero va en columnas apiladas: se ven 3 filas de 2 columnas, como un kanban de celular */
  .board { position: absolute; left: 60px; top: 450px; width: 860px; height: 940px; background: var(--white); border: 2px solid var(--outline); border-radius: 48px; box-shadow: var(--soft); overflow: hidden; }
  .bTop { height: 120px; border-bottom: 2px solid var(--outline); background: var(--surface3); display: flex; align-items: center; justify-content: space-between; padding: 0 36px; }
  .bTop .ch { font-weight: 700; font-size: 38px; } .bTop .ch span { color: var(--brand600); }
  .bTop .st { font-size: 24px; color: var(--iron); display: flex; gap: 10px; align-items: center; margin-top: 4px; } .bTop .st i { width: 13px; height: 13px; border-radius: 50%; background: var(--grass); }
  .stack { display: flex; } .stack .ava { width: 60px; height: 60px; margin-left: -14px; } .stack .ava img { width: 72px; }
  .grid { position: absolute; left: 28px; right: 28px; top: 148px; bottom: 28px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.55fr 1fr 1fr; gap: 20px; }
  .col { background: var(--surface); border-radius: 30px; padding: 22px; }
  .col h4 { display: flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 600; color: var(--metal); }
  .col h4 i { width: 14px; height: 14px; border-radius: 50%; }
  .col h4 em { margin-left: auto; font-style: normal; font-size: 22px; color: var(--iron); background: var(--white); border-radius: 999px; padding: 2px 14px; }
  .ghost { margin-top: 18px; height: calc(100% - 58px); border: 2px dashed var(--outline); border-radius: 22px; }
  .card { margin-top: 16px; background: var(--white); border: 2px solid var(--brand300); border-radius: 24px; padding: 20px; box-shadow: 0 16px 40px rgba(132,131,224,.24); position: relative; }
  .card .glow { position: absolute; inset: -10px; border-radius: 32px; border: 3px solid var(--brand500); opacity: .5; }
  .card .t { font-weight: 700; font-size: 28px; }
  .card p { font-size: 23px; line-height: 1.38; color: var(--metal); margin-top: 10px; }
  .card .ft { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--outline); font-size: 23px; font-weight: 600; }
  .card .ft .ava { width: 46px; height: 46px; border-width: 2px; } .card .ft .ava img { width: 56px; }
</style></head><body>
  <div class="dots"></div>
  <div class="hud-title">un pedido cruza<br />la fábrica<i></i></div>
  <div class="hud-ring" style="--p: 8%"><div class="ring"><b><i></i></b></div><span>1 · pedido</span></div>
  <div class="board">
    <div class="bTop"><div><div class="ch"><span>#</span> fabrica</div><div class="st"><i></i>La fábrica está trabajando</div></div>
      <div class="stack"><div class="ava"><img src="../assets/ghosty.svg" style="width:42px" /></div><div class="ava"><img src="../assets/factory-plan.svg" /></div><div class="ava"><img src="../assets/factory-build.svg" /></div><div class="ava"><img src="../assets/factory-check.svg" /></div></div></div>
    <div class="grid">
      <div class="col"><h4><i style="background:var(--bird)"></i>plan<em>1</em></h4>
        <div class="card"><div class="glow"></div><div class="t">🏭 Pedido #2</div><p>Agrega pruebas de vitest para las funciones de la agenda que arman la grilla de horarios.</p><div class="ft"><div class="ava"><img src="../assets/factory-plan.svg" /></div>@plan</div></div></div>
      <div class="col"><h4><i style="background:var(--brand500)"></i>esperando aprobación<em>0</em></h4><div class="ghost"></div></div>
      <div class="col"><h4><i style="background:var(--grass)"></i>build<em>0</em></h4><div class="ghost"></div></div>
      <div class="col"><h4><i style="background:var(--salmon)"></i>check<em>0</em></h4><div class="ghost"></div></div>
      <div class="col"><h4><i style="background:var(--cloud)"></i>PR<em>0</em></h4><div class="ghost"></div></div>
      <div class="col"><h4><i style="background:var(--dark)"></i>listo<em>0</em></h4><div class="ghost"></div></div>
    </div>
  </div>
  <div class="note" style="left: 300px; top: 1440px; font-size: 54px; transform: rotate(-3deg)">tu pedido entra aquí</div>
  <svg class="abs" style="left: 150px; top: 1400px" width="140" height="90" viewBox="0 0 140 90" fill="none" stroke="#b6b6ba" stroke-width="3.4" stroke-linecap="round"><path d="M136 60 C 90 70, 50 50, 20 12" /><path d="M10 22 L 19 9 L 33 14" stroke-linejoin="round" /></svg>
</body></html>
