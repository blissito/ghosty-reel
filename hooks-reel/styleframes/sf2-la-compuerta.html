<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SF2 — La compuerta</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--mint); }

  .shape-a { width: 420px; height: 420px; right: -140px; top: 120px; background: var(--cyan); }
  .shape-b { width: 460px; height: 200px; left: -260px; bottom: 500px; background: var(--cyan); }
  .shape-c { width: 300px; height: 300px; left: 820px; bottom: -190px; background: var(--yellow); }

  .kicker { color: var(--ink); margin-bottom: 26px; }
  .title { font-size: 92px; color: var(--paper); background: var(--ink); }
  .title em { font-style: normal; color: var(--mint); }

  /* el diagrama: modelo → compuerta → efecto */
  .flow { margin-top: 72px; display: flex; flex-direction: column; align-items: center; gap: 0; }

  .node {
    width: 100%; padding: 34px 36px; display: flex; align-items: center; gap: 26px;
    font-size: 36px; font-weight: 700;
  }
  .node .badge {
    font-family: 'Archivo Black', sans-serif; font-size: 30px; letter-spacing: 0.02em;
    padding: 10px 16px; border: 6px solid var(--ink); flex: none;
  }
  /* Papel, no morado: Ghosty ya es morado y se perdía contra el bloque. */
  .n-model { background: var(--paper); }
  .n-model .badge { background: var(--paper); }
  /* Ghosty oficial, sin repintar ni placa detrás. */
  .ghosty-mini { width: 130px; height: auto; display: block; flex: none; }

  .arrow { width: 0; height: 78px; border-left: 10px solid var(--ink); }
  .arrow-head {
    width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent;
    border-top: 30px solid var(--ink); margin-top: -2px;
  }

  /* la compuerta: la pieza rígida */
  .gate {
    width: 100%; background: var(--ink); color: var(--paper); padding: 44px 40px;
    position: relative;
  }
  .gate .g-title { font-family: 'Archivo Black', sans-serif; font-size: 72px; color: var(--mint); letter-spacing: -0.02em; }
  .gate .g-code { font-size: 32px; font-weight: 400; margin-top: 18px; line-height: 1.6; color: var(--paper); }
  .gate .g-code s { color: var(--red); text-decoration: none; }
  .gate .g-code b { color: var(--yellow); }
  .gate .stamp {
    position: absolute; right: -26px; top: -34px; transform: rotate(8deg);
    background: var(--yellow); color: var(--ink); border: 7px solid var(--ink);
    padding: 12px 20px; font-family: 'Archivo Black', sans-serif; font-size: 30px;
    box-shadow: 8px 8px 0 var(--ink);
  }

  /* teeth: dientes de compuerta, puro sólido */
  .teeth { display: flex; width: 100%; }
  .teeth i { flex: 1; height: 34px; background: var(--ink); border-right: 8px solid var(--mint); }
  .teeth i:last-child { border-right: 0; }

  .outcome { display: flex; gap: 26px; width: 100%; margin-top: 28px; }
  .out { flex: 1; padding: 28px 24px; text-align: center; font-size: 30px; font-weight: 700; }
  .out .big { font-family: 'Archivo Black', sans-serif; font-size: 54px; display: block; margin-bottom: 8px; }
  .allow { background: var(--grass); }
  .deny { background: var(--red); color: var(--paper); }

  .punch { margin-top: auto; font-size: 38px; font-weight: 700; line-height: 1.35; }
  .punch u { text-decoration: none; background: var(--ink); color: var(--mint); padding: 2px 12px; }
</style>
</head>
<body>
  <div class="bg">
    <div class="shape shape-a circle"></div>
    <div class="shape shape-b"></div>
    <div class="shape shape-c circle"></div>
  </div>

  <div class="stage">
    <div class="mono-tag kicker">02 · el mecanismo</div>
    <div class="label-block title display">Aquí <em>no decide</em><br>el modelo</div>

    <div class="flow">
      <div class="node n-model ink drop-sm">
        <img src="../assets/ghosty.png" alt="Ghosty" class="ghosty-mini">
        <span>quiere correr<br><code>rm -rf ./build</code></span>
      </div>

      <div class="arrow"></div>
      <div class="arrow-head"></div>

      <div class="gate ink drop">
        <div class="stamp">SIEMPRE CORRE</div>
        <div class="g-title">PreToolUse</div>
        <div class="g-code">
          if (cmd.match(/rm\s+-rf/)) →<br>
          &nbsp;&nbsp;<s>block</s> &nbsp;<b>exit 2</b>
        </div>
      </div>
      <div class="teeth"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

      <div class="outcome">
        <div class="out allow ink drop-sm"><span class="big">✓</span>lo permitido pasa</div>
        <div class="out deny ink drop-sm"><span class="big">✕</span>lo demás, no</div>
      </div>
    </div>

    <div class="punch">Se valida <u>aunque el modelo no quiera</u>.</div>
  </div>

  <div class="brand">fixtergeek</div>
</body>
</html>
