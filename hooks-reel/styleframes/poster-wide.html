<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Poster wide 1200x675</title>
<link rel="stylesheet" href="_base.css">
<style>
  /* Póster horizontal 1200x675 para el correo (Open Graph / miniatura). */
  html, body { width: 1200px; height: 675px; }
  body { background: var(--mint); }

  .shape-a { width: 380px; height: 380px; left: -230px; top: 220px; background: var(--cyan); }
  .shape-b { width: 300px; height: 300px; right: -110px; bottom: -130px; background: var(--yellow); }

  .wrap {
    position: relative; z-index: 1; height: 100%;
    padding: 64px 72px; display: flex; align-items: center; gap: 56px;
  }
  .left { flex: 1; }
  .kick { color: var(--ink); margin-bottom: 20px; }
  .title {
    display: inline-block; font-family: 'Archivo Black', sans-serif;
    font-size: 72px; line-height: 0.94; letter-spacing: -0.03em;
    color: var(--paper); background: var(--ink);
    border: var(--bw) solid var(--ink); box-shadow: 12px 12px 0 var(--ink);
    padding: 16px 26px 22px;
  }
  .title em { font-style: normal; color: var(--mint); }
  .sub {
    margin-top: 34px; font-size: 27px; font-weight: 700; line-height: 1.35;
    background: var(--paper); border: var(--bw) solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink); padding: 20px 24px; display: inline-block;
  }
  .sub u { text-decoration: none; background: var(--ink); color: var(--mint); padding: 2px 10px; }

  .right { flex: none; width: 300px; display: flex; justify-content: center; }
  .right img { width: 250px; height: auto; display: block; }

  .brand { left: 72px; bottom: 34px; }
</style>
</head>
<body>
  <div class="bg">
    <div class="shape shape-a circle"></div>
    <div class="shape shape-b circle"></div>
  </div>

  <div class="wrap">
    <div class="left">
      <div class="mono-tag kick">entrega 3 · sistemas agénticos</div>
      <div class="title">Aquí <em>no decide</em><br>el modelo</div>
      <div class="sub">El control que <u>se ejecuta siempre</u>.</div>
    </div>
    <div class="right"><img src="../assets/ghosty.png" alt="Ghosty"></div>
  </div>

  <div class="brand">fixtergeek</div>
</body>
</html>
