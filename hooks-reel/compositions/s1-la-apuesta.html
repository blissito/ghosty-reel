<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
          color: #141a1f;
        }
        #root .stage {
          position: absolute;
          inset: 0;
          padding: 110px 80px 210px;
          display: flex;
          flex-direction: column;
        }
        #s1-kicker {
          font-weight: 700;
          font-size: 26px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          margin-bottom: 26px;
        }
        #s1-title {
          align-self: flex-start;
          font-family: "Archivo Black", sans-serif;
          font-size: 118px;
          line-height: 0.92;
          letter-spacing: -0.03em;
          color: #f7f0e4;
          background: #141a1f;
          border: 8px solid #141a1f;
          box-shadow: 12px 12px 0 #141a1f;
          padding: 18px 30px 24px;
        }
        #s1-title em {
          font-style: normal;
          color: #f5c542;
        }

        #s1-scene {
          margin-top: 96px;
          display: flex;
          align-items: flex-start;
          gap: 30px;
        }
        #s1-note {
          width: 420px;
          flex: none;
          margin-top: 40px;
          background: #f7f0e4;
          border: 8px solid #141a1f;
          box-shadow: 7px 7px 0 #141a1f;
          padding: 28px 30px;
        }
        #s1-note .who {
          font-size: 21px;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        }
        #s1-note .rule {
          font-size: 36px;
          font-weight: 700;
          line-height: 1.25;
          margin-top: 14px;
        }

        #s1-figure {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #s1-ghosty-wrap {
          position: relative;
          width: 300px;
        }
        #s1-ghosty {
          width: 100%;
          height: auto;
          display: block;
        }
        #s1-marks {
          position: absolute;
          inset: -70px -80px;
          width: calc(100% + 160px);
          height: calc(100% + 140px);
          overflow: visible;
        }
        #s1-cap {
          margin-top: 18px;
          font-family: "Archivo Black", sans-serif;
          font-size: 40px;
          letter-spacing: -0.02em;
          text-align: center;
          line-height: 1.05;
        }

        #s1-odds {
          margin-top: 72px;
          display: flex;
          align-items: stretch;
        }
        #s1-odds .n {
          flex: none;
          background: #e0574e;
          color: #f7f0e4;
          font-family: "Archivo Black", sans-serif;
          font-size: 92px;
          line-height: 1;
          padding: 26px 32px;
          border: 8px solid #141a1f;
          box-shadow: 7px 7px 0 #141a1f;
        }
        #s1-odds .t {
          background: #f7f0e4;
          padding: 26px 32px;
          font-size: 34px;
          font-weight: 700;
          line-height: 1.3;
          display: flex;
          align-items: center;
          border: 8px solid #141a1f;
          box-shadow: 7px 7px 0 #141a1f;
        }

        #s1-punch {
          margin-top: 56px;
          font-size: 40px;
          font-weight: 700;
          line-height: 1.35;
          background: #f7f0e4;
          border: 8px solid #141a1f;
          box-shadow: 12px 12px 0 #141a1f;
          padding: 30px 32px;
        }
        #s1-punch u {
          text-decoration: none;
          background: #141a1f;
          color: #f5c542;
          padding: 2px 12px;
        }
      </style>

      <div id="root" data-composition-id="s1-la-apuesta" data-width="1080" data-height="1920">
        <div class="stage">
          <div id="s1-kicker">01 · el problema</div>
          <div id="s1-title">Pedirle<br />que <em>obedezca</em></div>

          <div id="s1-scene">
            <div id="s1-note">
              <div class="who">system prompt</div>
              <div class="rule">"NUNCA borres<br />archivos sin<br />confirmar."</div>
            </div>

            <div id="s1-figure">
              <div id="s1-ghosty-wrap">
                <img id="s1-ghosty" src="assets/ghosty.png" alt="Ghosty" />
                <svg id="s1-marks" viewBox="0 0 460 480" xmlns="http://www.w3.org/2000/svg" fill="none">
                  <g stroke="#141A1F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
                    <path id="s1-q" d="M356 92c4-22 40-24 46-4 6 18-18 24-20 40" fill="none" />
                    <circle id="s1-qdot" cx="380" cy="150" r="6" fill="#141A1F" />
                    <path
                      id="s1-drop"
                      d="M96 118c0 0-22 26-22 39 0 12 10 21 22 21s22-9 22-21c0-13-22-39-22-39Z"
                      fill="#4FC7EE"
                    />
                    <path id="s1-nerve" d="M60 196L20 182M74 246L30 252M52 148L14 128" />
                    <!-- La boca NO existe en el Ghosty oficial: es un recurso
                         expresivo exclusivo del video, un trazo encima del PNG
                         (no se repinta el asset). Torcida, nunca sonrisa.
                         Ghosty pasa por tres estados mientras la narración
                         enumera por qué se le pasa la regla. -->
                    <path id="s1-mouth" d="M204 272c10 12 22 12 32 2 9-9 20-8 28 3" stroke-width="9" />

                    <!-- Estado 2: abrumado. Boca de zigzag y remolinos. -->
                    <g id="s1-state-dizzy" opacity="0">
                      <path d="M202 274l14 10 14-12 14 12 14-10 12 8" stroke-width="9" />
                      <path d="M118 96c-14-6-26 6-20 18 8 16 32 10 36-8 5-22-20-36-40-24" stroke-width="8" />
                      <path d="M352 128c14-6 26 6 20 18-8 16-32 10-36-8-5-22 20-36 40-24" stroke-width="8" />
                    </g>

                    <!-- Estado 3: emo. Fleco sobre un ojo, boca plana caída,
                         lagrimita. Aparece justo en "un día raro del modelo". -->
                    <g id="s1-state-emo" opacity="0">
                      <path
                        d="M104 150c6-52 62-86 128-84 52 2 92 24 110 52-34-16-70-14-96 6-22 17-30 44-26 74-16-30-40-46-70-46-20 0-33 6-46 18Z"
                        fill="#141A1F"
                        stroke="none"
                      />
                      <path d="M206 280c22-6 42-6 62 2" stroke-width="9" />
                      <path
                        d="M300 232c0 0-13 17-13 25 0 8 6 13 13 13s13-5 13-13c0-8-13-25-13-25Z"
                        fill="#141A1F"
                        stroke="none"
                      />
                    </g>
                  </g>
                </svg>
              </div>
              <div id="s1-cap">lee tu regla<br />y luego decide</div>
            </div>
          </div>

          <div id="s1-odds">
            <div class="n">10×</div>
            <div class="t">al día tu regla<br />no existió</div>
          </div>

          <div id="s1-punch"><u>Una</u> basta para borrar<br />lo que no se podía borrar.</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const POP = "back.out(1.7)";

          // Entradas de caricatura: llegan deformadas y se asientan.
          tl.fromTo("#s1-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          tl.fromTo(
            "#s1-title",
            { scaleX: 1.12, scaleY: 0.86, opacity: 0, y: -40 },
            { scaleX: 1, scaleY: 1, opacity: 1, y: 0, duration: 0.6, ease: POP },
            0.45
          );

          // La regla cae torcida y rebota.
          tl.fromTo(
            "#s1-note",
            { opacity: 0, y: -140, rotation: -14 },
            { opacity: 1, y: 0, rotation: -2.5, duration: 0.7, ease: POP },
            4.6
          );

          // Ghosty entra desde la derecha.
          tl.fromTo(
            "#s1-ghosty-wrap",
            { opacity: 0, x: 220, scaleX: 1.14, scaleY: 0.88 },
            { opacity: 1, x: 0, scaleX: 1, scaleY: 1, duration: 0.7, ease: POP },
            8.2
          );
          // Ve la nota: se ladea y regresa.
          tl.to("#s1-ghosty", { rotation: -6, duration: 0.5, ease: "power2.inOut" }, 9.6);
          tl.to("#s1-ghosty", { rotation: 0, duration: 0.6, ease: "power2.inOut" }, 10.9);

          // Los adornos llegan en pops discretos, no en fade.
          tl.fromTo("#s1-q", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.28, ease: POP }, 11.6);
          tl.fromTo("#s1-qdot", { opacity: 0 }, { opacity: 1, duration: 0.14 }, 11.85);
          tl.fromTo("#s1-drop", { opacity: 0, y: -22 }, { opacity: 1, y: 0, duration: 0.32, ease: POP }, 12.3);
          tl.fromTo("#s1-nerve", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 12.7);
          // La boca aparece con la duda y luego se tuerce un poco más.
          tl.fromTo("#s1-mouth", { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: POP }, 11.9);
          tl.to("#s1-mouth", { y: 4, skewX: -6, duration: 0.6, ease: "power2.inOut" }, 17.4);
          tl.to("#s1-mouth", { y: 0, skewX: 0, duration: 0.7, ease: "power2.inOut" }, 20.2);

          tl.fromTo("#s1-cap", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 13.2);

          // Respiración: Ghosty nunca se queda del todo quieto. Termina antes
          // de los estados para no pelearse con ellos por la misma propiedad.
          tl.to("#s1-ghosty-wrap", { y: -14, duration: 2.2, ease: "sine.inOut" }, 14.2);
          tl.to("#s1-ghosty-wrap", { y: 0, duration: 2.2, ease: "sine.inOut" }, 16.4);

          // --- Los tres estados de Ghosty ---
          // Tiempos MEDIDOS con `hyperframes transcribe` (whisper medium,
          // timestamps por palabra) sobre el wav. Estimar los cortes contando
          // caracteres o buscando silencios falla: los tres ítems duran ~1s
          // cada uno y quedaban 3.3s tarde.
          // El audio arranca 1.2s después de la escena, por eso wav + 1.2:
          //   wav 18.15  "contexto"     → escena 19.35
          //   wav 19.19  "instrucción"  → escena 20.39
          //   wav 21.31  "día raro"     → escena 22.51
          //   wav 22.74  "parece poco"  → escena 23.94
          // Cada estado entra un pelo ANTES de la palabra: si entra después,
          // se lee como reacción tardía.

          // "Un contexto largo": se ladea, agobiado.
          tl.to("#s1-ghosty", { rotation: 5, y: 8, duration: 0.35, ease: "back.out(2)" }, 19.15);

          // "una instrucción que la contradice a medias": mareado.
          tl.to("#s1-mouth", { opacity: 0, duration: 0.1 }, 20.15);
          tl.to("#s1-state-dizzy", { opacity: 1, duration: 0.14 }, 20.2);
          tl.to("#s1-ghosty", { rotation: -7, duration: 0.45, ease: "power2.inOut" }, 20.3);
          tl.to("#s1-ghosty", { rotation: 6, duration: 0.45, ease: "power2.inOut" }, 20.8);
          tl.to("#s1-ghosty", { rotation: -4, duration: 0.45, ease: "power2.inOut" }, 21.3);
          tl.to("#s1-state-dizzy", { rotation: -8, transformOrigin: "50% 50%", duration: 1.2, ease: "sine.inOut" }, 20.3);

          // "un día raro del modelo": Ghosty emo. El fleco cae de golpe.
          tl.to("#s1-state-dizzy", { opacity: 0, duration: 0.1 }, 22.25);
          tl.to("#s1-q, #s1-qdot, #s1-drop, #s1-nerve", { opacity: 0, duration: 0.14 }, 22.25);
          tl.fromTo(
            "#s1-state-emo",
            { opacity: 0, y: -34 },
            { opacity: 1, y: 0, duration: 0.26, ease: "back.out(2.2)" },
            22.3
          );
          // Cabizbajo, como debe ser. Se sostiene un rato: es el chiste.
          tl.to("#s1-ghosty", { rotation: -3, y: 16, duration: 0.45, ease: "power2.out" }, 22.4);
          tl.to("#s1-ghosty", { y: 24, duration: 1.8, ease: "sine.inOut" }, 23.1);

          // Se le pasa: vuelve a su estado normal antes del remate.
          tl.to("#s1-state-emo", { opacity: 0, duration: 0.2 }, 26.6);
          tl.to("#s1-mouth", { opacity: 1, duration: 0.2 }, 26.7);
          tl.to("#s1-q, #s1-qdot, #s1-drop, #s1-nerve", { opacity: 1, duration: 0.24 }, 26.7);
          tl.to("#s1-ghosty", { rotation: 0, y: 0, duration: 0.5, ease: POP }, 26.7);

          // La cifra entra de golpe.
          tl.fromTo(
            "#s1-odds",
            { opacity: 0, scaleX: 1.2, scaleY: 0.7 },
            { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.5, ease: POP },
            24.4
          );

          tl.fromTo(
            "#s1-punch",
            { opacity: 0, y: 60, scaleY: 0.88 },
            { opacity: 1, y: 0, scaleY: 1, duration: 0.55, ease: POP },
            30.2
          );

          window.__timelines["s1-la-apuesta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
